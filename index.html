<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

        <title>CyberLab</title>

        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <main class="contenedor">

            <h1>PhoenixLab</h1>

            <p class="subtitulo">
                Red Segura
            </p>

            <form id="loginForm">

                <label for="usuario">
                    Usuario:
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese un usuario de prueba"
                    required
                >

                <label for="clave">
                    Contraseña:
                </label>

                <input
                    type="password"
                    id="clave"
                    placeholder="Ingrese una contraseña de prueba"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <div id="resultado"></div>

        </main>

        <main class="contenedor2">

            <h2>¿Cómo identificar un sitio sospechoso?</h2>

            <p class="consejos-seguridad">
                - Revisa la URL (Dirección web)
                -Calidad del contenido y diseño
                -Comportamientos extraños y ofertas
            </p>

        
                

       

        <script src="script.js"></script>

    </body>

</html>
